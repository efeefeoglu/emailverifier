name: Deploy to DreamHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
          SSH_HOST: ${{ secrets.DREAMHOST_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/dreamhost
          chmod 600 ~/.ssh/dreamhost

          ssh-keyscan -T 10 -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload application
        env:
          SSH_HOST: ${{ secrets.DREAMHOST_HOST }}
          SSH_USER: ${{ secrets.DREAMHOST_USER }}
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'venv/' \
            --exclude '.venv/' \
            --exclude '.env' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            -e "ssh -i ~/.ssh/dreamhost" \
            ./ \
            "$SSH_USER@$SSH_HOST:~/verify.efeefeoglu.com/"

      - name: Install dependencies and restart
        env:
          SSH_HOST: ${{ secrets.DREAMHOST_HOST }}
          SSH_USER: ${{ secrets.DREAMHOST_USER }}
        run: |
          ssh \
            -i ~/.ssh/dreamhost \
            "$SSH_USER@$SSH_HOST" \
            'bash -s' << 'EOF'

          set -e

          APP_DIR="$HOME/verify.efeefeoglu.com"

          cd "$APP_DIR"

          echo "==> Setting up Python environment"

          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi

          source venv/bin/activate

          echo "==> Installing dependencies"
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          echo "==> Restarting services"

          export XDG_RUNTIME_DIR="/run/user/$(id -u)"

          systemctl --user restart email-verifier-web.service
          #systemctl --user restart email-verifier-worker.service

          echo "==> Checking services"

          systemctl --user is-active email-verifier-web.service
          #systemctl --user is-active email-verifier-worker.service

          echo "==> Deployment completed"
          EOF

      - name: Health check
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          for attempt in {1..10}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              "$HEALTHCHECK_URL"; then

              echo ""
              echo "Application is healthy."
              exit 0
            fi

            echo "Health check attempt $attempt failed."
            sleep 5
          done

          echo "Health check failed."
          exit 1
