name: Validate deployment secrets
env:
  SSH_PRIVATE_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
  SSH_HOST: ${{ secrets.DREAMHOST_HOST }}
  SSH_USER: ${{ secrets.DREAMHOST_USER }}
run: |
  [ -n "$SSH_PRIVATE_KEY" ] || { echo "DREAMHOST_SSH_KEY is missing"; exit 1; }
  [ -n "$SSH_HOST" ] || { echo "DREAMHOST_HOST is missing"; exit 1; }
  [ -n "$SSH_USER" ] || { echo "DREAMHOST_USER is missing"; exit 1; }

  echo "SSH key exists"
  echo "SSH host exists"
  echo "SSH user exists"
