<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Email Format Verifier</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">SMTP mailbox check</p>
      <h1>Email Verifier</h1>
      <p class="intro">Enter one email address per line. We check its format, mail DNS, and—when configured—the recipient server's SMTP response without sending email.</p>

      <form id="verify-form">
        <label for="emails">Email addresses</label>
        <textarea id="emails" rows="8" placeholder="jane@company.com&#10;john@@company.com" required></textarea>
        <button type="submit">Check addresses</button>
      </form>

      <section id="results" hidden aria-live="polite">
        <div class="results-heading">
          <div>
            <p class="eyebrow">Verification report</p>
            <h2>Results</h2>
          </div>
          <p id="result-summary" class="result-summary"></p>
        </div>
        <div id="result-list" class="result-list"></div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
